version: 2
updates:
  - package-ecosystem: npm
    directory: /themes/erp-mini
    schedule:
      interval: daily
      time: "05:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      emdash-core:
        patterns: ["emdash", "@emdash-cms/cloudflare"]
      react-host:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "@astrojs/react", "oxc-transform-react"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
